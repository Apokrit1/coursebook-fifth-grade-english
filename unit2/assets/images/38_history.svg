<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_history" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#feebc8"/>
    </linearGradient>
    <pattern id="dots_history" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#b7791f" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_history" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_history)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_history)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="144" height="22" rx="6" fill="#b7791f" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_history)"/>
    <text x="72" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SCHOOL SUBJECTS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-8)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#d69e2e" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">ANCIENT!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_history)">
    
      <!-- Greek Column & Ancient Scroll -->
      <g transform="translate(-24, 0)">
        <!-- Capital -->
        <rect x="-14" y="-30" width="28" height="8" rx="2" fill="#edf2f7" stroke="#1a202c" stroke-width="3"/>
        <ellipse cx="-12" cy="-30" rx="4" ry="4" fill="#cbd5e0"/>
        <ellipse cx="12" cy="-30" rx="4" ry="4" fill="#cbd5e0"/>
        <!-- Shaft -->
        <rect x="-10" y="-22" width="20" height="50" fill="#e2e8f0" stroke="#1a202c" stroke-width="3"/>
        <!-- Base -->
        <rect x="-14" y="28" width="28" height="8" rx="2" fill="#edf2f7" stroke="#1a202c" stroke-width="3"/>
      </g>
      <!-- Hourglass -->
      <g transform="translate(24, 0)">
        <polygon points="-16,-28 16,-28 0,-4" fill="#ecc94b" stroke="#1a202c" stroke-width="3"/>
        <polygon points="-16,28 16,28 0,-4" fill="#d69e2e" stroke="#1a202c" stroke-width="3"/>
        <line x1="-20" y1="-28" x2="20" y2="-28" stroke="#744210" stroke-width="4"/>
        <line x1="-20" y1="28" x2="20" y2="28" stroke="#744210" stroke-width="4"/>
      </g>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">history</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ˈhɪstri] • ιστορία</text>
</svg>