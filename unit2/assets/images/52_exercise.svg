<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_exercise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fed7d7"/>
    </linearGradient>
    <pattern id="dots_exercise" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#e53e3e" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_exercise" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_exercise)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_exercise)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="208" height="22" rx="6" fill="#e53e3e" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_exercise)"/>
    <text x="104" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SPORTS, HEALTH & HABITS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(12)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#feb2b2" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">ENERGY!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_exercise)">
    
      <!-- Running Sneaker with motion lines -->
      <g transform="translate(0, 4)">
        <path d="M -34,16 L 24,16 C 36,16 38,4 30,0 L 14,-14 L -10,-14 L -20,2 L -34,6 Z" fill="#3182ce" stroke="#1a202c" stroke-width="3.5"/>
        <rect x="-36" y="16" width="70" height="8" rx="4" fill="#ffffff" stroke="#1a202c" stroke-width="2.5"/>
        <!-- Motion lines -->
        <line x1="-44" y1="2" x2="-38" y2="2" stroke="#1a202c" stroke-width="3"/>
        <line x1="-48" y1="12" x2="-40" y2="12" stroke="#1a202c" stroke-width="3"/>
      </g>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">exercise</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ˈeksəsaɪz] • άσκηση, γυμναστική</text>
</svg>