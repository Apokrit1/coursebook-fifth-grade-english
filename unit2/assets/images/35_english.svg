<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_English" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fed7d7"/>
    </linearGradient>
    <pattern id="dots_English" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#e53e3e" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_English" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_English)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_English)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="144" height="22" rx="6" fill="#e53e3e" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_English)"/>
    <text x="72" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SCHOOL SUBJECTS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(14)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#feb2b2" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">HELLO!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_English)">
    
      <!-- English Book with UK Flag motif -->
      <rect x="-42" y="-32" width="84" height="64" rx="6" fill="#ffffff" stroke="#1a202c" stroke-width="3.5"/>
      <rect x="-42" y="-32" width="14" height="64" rx="3" fill="#2b6cb0"/>
      <!-- UK Flag detail -->
      <g transform="translate(4, -6)">
        <rect x="-26" y="-18" width="52" height="36" fill="#2b6cb0" stroke="#1a202c" stroke-width="2"/>
        <line x1="-26" y1="-18" x2="26" y2="18" stroke="#ffffff" stroke-width="6"/>
        <line x1="-26" y1="18" x2="26" y2="-18" stroke="#ffffff" stroke-width="6"/>
        <line x1="-26" y1="-18" x2="26" y2="18" stroke="#e53e3e" stroke-width="2.5"/>
        <line x1="-26" y1="18" x2="26" y2="-18" stroke="#e53e3e" stroke-width="2.5"/>
        <line x1="0" y1="-18" x2="0" y2="18" stroke="#ffffff" stroke-width="10"/>
        <line x1="-26" y1="0" x2="26" y2="0" stroke="#ffffff" stroke-width="10"/>
        <line x1="0" y1="-18" x2="0" y2="18" stroke="#e53e3e" stroke-width="5"/>
        <line x1="-26" y1="0" x2="26" y2="0" stroke="#e53e3e" stroke-width="5"/>
      </g>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">English</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ˈɪŋɡlɪʃ] • Αγγλικά (μάθημα)</text>
</svg>