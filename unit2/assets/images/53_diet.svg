<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_diet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fff4"/>
      <stop offset="100%" stop-color="#c6f6d5"/>
    </linearGradient>
    <pattern id="dots_diet" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#38a169" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_diet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_diet)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_diet)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="208" height="22" rx="6" fill="#38a169" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_diet)"/>
    <text x="104" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SPORTS, HEALTH & HABITS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-8)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#48bb78" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">BALANCE!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_diet)">
    
      <!-- Nutrition Balance Plate -->
      <circle cx="0" cy="0" r="36" fill="#ffffff" stroke="#1a202c" stroke-width="3.5"/>
      <!-- 3 Segments: Veg, Protein, Carbs -->
      <path d="M 0,0 L 0,-36 A 36,36 0 0,1 36,0 Z" fill="#48bb78" opacity="0.8"/>
      <path d="M 0,0 L 36,0 A 36,36 0 0,1 -18,31 Z" fill="#ed8936" opacity="0.8"/>
      <path d="M 0,0 L -18,31 A 36,36 0 0,1 0,-36 Z" fill="#ecd599" opacity="0.8"/>
      <circle cx="0" cy="0" r="4" fill="#1a202c"/>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">diet</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ˈdaɪət] • διατροφή, δίαιτα</text>
</svg>