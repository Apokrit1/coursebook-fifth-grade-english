<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_butter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffff0"/>
      <stop offset="100%" stop-color="#fefcbf"/>
    </linearGradient>
    <pattern id="dots_butter" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#d69e2e" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_butter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_butter)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_butter)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="192" height="22" rx="6" fill="#d69e2e" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_butter)"/>
    <text x="96" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FOOD & CANTEEN SNACKS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(10)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#f6e05e" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">MELT!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_butter)">
    
      <!-- Butter Dish -->
      <ellipse cx="0" cy="20" rx="52" ry="16" fill="#edf2f7" stroke="#1a202c" stroke-width="3.5"/>
      <!-- Block of Butter -->
      <polygon points="-32,10 18,10 32,-8 -18,-8" fill="#faf089" stroke="#1a202c" stroke-width="3.5"/>
      <polygon points="-32,10 -32,-4 -18,-22 -18,-8" fill="#f6e05e" stroke="#1a202c" stroke-width="3.5"/>
      <polygon points="-18,-22 32,-22 32,-8 -18,-8" fill="#fff9c4" stroke="#1a202c" stroke-width="3.5"/>
      <!-- Butter Knife -->
      <g transform="translate(26, -14) rotate(45)">
        <rect x="-4" y="-24" width="8" height="36" rx="4" fill="#a0aec0" stroke="#1a202c" stroke-width="2"/>
        <rect x="-3" y="12" width="6" height="16" rx="2" fill="#744210" stroke="#1a202c" stroke-width="2"/>
      </g>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">butter</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ˈbʌtə] • βούτυρο</text>
</svg>