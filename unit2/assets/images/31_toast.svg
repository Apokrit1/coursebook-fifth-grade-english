<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_toast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#fbd38d"/>
    </linearGradient>
    <pattern id="dots_toast" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#b7791f" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_toast" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_toast)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_toast)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="192" height="22" rx="6" fill="#b7791f" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_toast)"/>
    <text x="96" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FOOD & CANTEEN SNACKS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-8)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#ecc94b" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">WARM!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_toast)">
    
      <!-- Two Slices of Toast -->
      <g transform="translate(-10, -6) rotate(-8)">
        <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#d69e2e" stroke="#1a202c" stroke-width="3.5"/>
        <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#ecc94b"/>
        <!-- Butter melting -->
        <rect x="-8" y="-8" width="16" height="12" rx="3" fill="#faf089" stroke="#1a202c" stroke-width="2"/>
      </g>
      <g transform="translate(14, 6) rotate(10)">
        <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#c05621" stroke="#1a202c" stroke-width="3.5"/>
        <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#dd6b20"/>
      </g>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">toast</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[təʊst] • φρυγανισμένο ψωμί, τοστ</text>
</svg>