<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_tea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#feebc8"/>
    </linearGradient>
    <pattern id="dots_tea" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#975a16" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_tea" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_tea)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_tea)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="192" height="22" rx="6" fill="#975a16" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_tea)"/>
    <text x="96" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FOOD & CANTEEN SNACKS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-12)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#ed8936" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">HOT!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_tea)">
    
      <!-- Steaming Mug -->
      <!-- Steam -->
      <path d="M -12,-32 Q -18,-44 -10,-52" stroke="#a0aec0" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 0,-34 Q 6,-46 -2,-56" stroke="#a0aec0" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 12,-32 Q 6,-44 14,-52" stroke="#a0aec0" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Saucer -->
      <ellipse cx="0" cy="30" rx="44" ry="12" fill="#cbd5e0" stroke="#1a202c" stroke-width="3.5"/>
      <!-- Mug Body -->
      <rect x="-26" y="-22" width="52" height="46" rx="6" fill="#e53e3e" stroke="#1a202c" stroke-width="3.5"/>
      <!-- Mug Handle -->
      <path d="M 26,-12 C 40,-12 40,14 26,16" stroke="#1a202c" stroke-width="3.5" fill="none"/>
      <!-- Tea Tag String -->
      <line x1="8" y1="-22" x2="16" y2="2" stroke="#718096" stroke-width="2"/>
      <rect x="12" y="2" width="10" height="12" rx="2" fill="#ecc94b" stroke="#1a202c" stroke-width="1.5"/>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">tea</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[tiː] • τσάι</text>
</svg>