<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_art" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#fed7e2"/>
    </linearGradient>
    <pattern id="dots_art" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#ed64a6" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_art" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_art)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_art)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="144" height="22" rx="6" fill="#ed64a6" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_art)"/>
    <text x="72" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SCHOOL SUBJECTS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(14)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#f687b3" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">DRAW!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_art)">
    
      <!-- Painter's Palette & Brush -->
      <path d="M -34,16 C -48,0 -38,-28 0,-28 C 38,-28 48,-4 36,20 C 26,36 -4,36 -20,24 C -26,18 -28,24 -34,16 Z" fill="#f6ad55" stroke="#1a202c" stroke-width="3.5"/>
      <!-- Thumb hole -->
      <ellipse cx="-16" cy="14" rx="6" ry="8" fill="#fff5f7" stroke="#1a202c" stroke-width="2.5"/>
      <!-- Paint Dabs -->
      <circle cx="-16" cy="-14" r="5" fill="#e53e3e"/>
      <circle cx="2" cy="-18" r="5" fill="#3182ce"/>
      <circle cx="20" cy="-12" r="5" fill="#ecc94b"/>
      <circle cx="26" cy="4" r="5" fill="#48bb78"/>
      <!-- Paintbrush -->
      <g transform="translate(18, -10) rotate(-35)">
        <rect x="-3" y="-36" width="6" height="42" rx="2" fill="#744210" stroke="#1a202c" stroke-width="2"/>
        <rect x="-4" y="6" width="8" height="12" fill="#a0aec0" stroke="#1a202c" stroke-width="1.5"/>
        <path d="M -4,18 C -4,26 4,26 4,18 Z" fill="#3182ce"/>
      </g>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">art</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ɑːt] • εικαστικά, καλλιτεχνικά</text>
</svg>