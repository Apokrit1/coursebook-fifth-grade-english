<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_bored" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <pattern id="dots_bored" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#718096" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_bored" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_bored)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_bored)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="176" height="22" rx="6" fill="#718096" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_bored)"/>
    <text x="88" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FEELINGS & EMOTIONS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-12)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#cbd5e0" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">ZZZ...</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_bored)">
    
      <!-- Bored Comic Character Face -->
      <circle cx="0" cy="0" r="38" fill="#e2e8f0" stroke="#1a202c" stroke-width="3.5"/>
      <!-- Droopy half-shut eyes -->
      <line x1="-22" y1="-6" x2="-8" y2="-6" stroke="#1a202c" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="-6" x2="22" y2="-6" stroke="#1a202c" stroke-width="4" stroke-linecap="round"/>
      <!-- Flat straight mouth -->
      <line x1="-14" y1="18" x2="14" y2="18" stroke="#1a202c" stroke-width="4" stroke-linecap="round"/>
      <!-- Hand propping chin -->
      <path d="M -12,32 C -18,24 -24,36 -14,40" stroke="#1a202c" stroke-width="3.5" fill="#cbd5e0"/>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">bored</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[bɔːd] • βαριεστημένος</text>
</svg>