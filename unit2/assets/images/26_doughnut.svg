<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_doughnut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#fed7e2"/>
    </linearGradient>
    <pattern id="dots_doughnut" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#d53f8c" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_doughnut" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_doughnut)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_doughnut)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="192" height="22" rx="6" fill="#d53f8c" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_doughnut)"/>
    <text x="96" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FOOD & CANTEEN SNACKS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(12)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#ecc94b" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">YUM!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_doughnut)">
    
      <!-- Doughnut Pastry -->
      <ellipse cx="0" cy="0" rx="52" ry="42" fill="#dd6b20" stroke="#1a202c" stroke-width="3.5"/>
      <ellipse cx="-2" cy="-3" rx="48" ry="38" fill="#ed8936"/>
      <!-- Chocolate/Berry Icing -->
      <path d="M -44,-8 C -40,16 -26,24 -14,16 C -2,24 10,16 20,24 C 32,20 42,12 44,-8 C 46,-24 28,-34 0,-34 C -28,-34 -46,-24 -44,-8 Z" fill="#805ad5" stroke="#1a202c" stroke-width="3"/>
      <!-- Hole -->
      <ellipse cx="0" cy="-2" rx="16" ry="12" fill="#fff5f7" stroke="#1a202c" stroke-width="3.5"/>
      <!-- Colorful Sprinkles -->
      <rect x="-28" y="-18" width="7" height="3" rx="1.5" fill="#ecc94b" transform="rotate(25 -28 -18)" stroke="#1a202c" stroke-width="1"/>
      <rect x="16" y="-20" width="7" height="3" rx="1.5" fill="#48bb78" transform="rotate(-30 16 -20)" stroke="#1a202c" stroke-width="1"/>
      <rect x="-18" y="2" width="7" height="3" rx="1.5" fill="#63b3ed" transform="rotate(40 -18 2)" stroke="#1a202c" stroke-width="1"/>
      <rect x="20" y="2" width="7" height="3" rx="1.5" fill="#ecc94b" transform="rotate(15 20 2)" stroke="#1a202c" stroke-width="1"/>
      <rect x="-2" y="-26" width="7" height="3" rx="1.5" fill="#feb2b2" transform="rotate(-10 -2 -26)" stroke="#1a202c" stroke-width="1"/>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">doughnut</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ˈdəʊnʌt] • ντόνατ</text>
</svg>