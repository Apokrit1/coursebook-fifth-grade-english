<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_orange_juice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#feebc8"/>
    </linearGradient>
    <pattern id="dots_orange_juice" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#dd6b20" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_orange_juice" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_orange_juice)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_orange_juice)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="192" height="22" rx="6" fill="#dd6b20" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_orange_juice)"/>
    <text x="96" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FOOD & CANTEEN SNACKS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-8)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#f6ad55" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">FRESH!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_orange_juice)">
    
      <!-- Glass -->
      <polygon points="-24,-36 24,-36 18,36 -18,36" fill="#e2e8f0" stroke="#1a202c" stroke-width="3.5" opacity="0.6"/>
      <!-- Juice -->
      <polygon points="-21,-12 21,-12 16,34 -16,34" fill="#ed8936" stroke="#1a202c" stroke-width="2.5"/>
      <!-- Straw -->
      <line x1="6" y1="-44" x2="-6" y2="28" stroke="#e53e3e" stroke-width="5" stroke-linecap="round"/>
      <line x1="6" y1="-44" x2="16" y2="-52" stroke="#e53e3e" stroke-width="5" stroke-linecap="round"/>
      <!-- Orange Slice -->
      <g transform="translate(24, -30)">
        <circle cx="0" cy="0" r="18" fill="#dd6b20" stroke="#1a202c" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="15" fill="#fbd38d"/>
        <line x1="0" y1="-15" x2="0" y2="15" stroke="#dd6b20" stroke-width="2"/>
        <line x1="-15" y1="0" x2="15" y2="0" stroke="#dd6b20" stroke-width="2"/>
      </g>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">orange juice</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ˌɒrɪndʒ ˈdʒuːs] • χυμός πορτοκάλι</text>
</svg>