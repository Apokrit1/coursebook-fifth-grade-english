<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_gym" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#feebc8"/>
    </linearGradient>
    <pattern id="dots_gym" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#dd6b20" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_gym" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_gym)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_gym)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="144" height="22" rx="6" fill="#dd6b20" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_gym)"/>
    <text x="72" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SCHOOL SUBJECTS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(12)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#f6ad55" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">MOVE!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_gym)">
    
      <!-- Basketball, Whistle & Sneakers -->
      <circle cx="-18" cy="2" r="26" fill="#ed8936" stroke="#1a202c" stroke-width="3.5"/>
      <path d="M -44,2 A 26,26 0 0,0 8,2" stroke="#1a202c" stroke-width="2.5" fill="none"/>
      <line x1="-18" y1="-24" x2="-18" y2="28" stroke="#1a202c" stroke-width="2.5"/>
      <!-- Whistle -->
      <g transform="translate(24, -10)">
        <ellipse cx="0" cy="0" rx="14" ry="10" fill="#cbd5e0" stroke="#1a202c" stroke-width="3"/>
        <rect x="-14" y="-4" width="14" height="8" rx="2" fill="#cbd5e0" stroke="#1a202c" stroke-width="2.5"/>
        <line x1="-14" y1="-4" x2="-22" y2="-18" stroke="#718096" stroke-width="3"/>
      </g>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">gym</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[dʒɪm] • γυμναστική</text>
</svg>