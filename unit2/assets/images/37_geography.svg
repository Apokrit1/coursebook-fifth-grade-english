<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_geography" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebf8ff"/>
      <stop offset="100%" stop-color="#90cdf4"/>
    </linearGradient>
    <pattern id="dots_geography" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#2b6cb0" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_geography" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_geography)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_geography)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="144" height="22" rx="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_geography)"/>
    <text x="72" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SCHOOL SUBJECTS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(12)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#68d391" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">WORLD!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_geography)">
    
      <!-- World Globe on Stand -->
      <!-- Stand Base -->
      <ellipse cx="0" cy="34" rx="24" ry="7" fill="#4a5568" stroke="#1a202c" stroke-width="3"/>
      <line x1="0" y1="18" x2="0" y2="34" stroke="#1a202c" stroke-width="4.5"/>
      <!-- Curved Axis -->
      <path d="M -30,-4 C -36,20 10,32 18,22" stroke="#1a202c" stroke-width="4" fill="none"/>
      <!-- Globe Circle -->
      <circle cx="0" cy="-6" r="34" fill="#4299e1" stroke="#1a202c" stroke-width="3.5"/>
      <!-- Continents -->
      <path d="M -22,-14 Q -12,-24 0,-18 Q 14,-14 16,-4 Q 4,6 -8,4 Q -16,14 -24,4 Z" fill="#48bb78" stroke="#1a202c" stroke-width="2"/>
      <path d="M 6,10 Q 16,12 24,18 Q 18,28 6,24 Z" fill="#48bb78" stroke="#1a202c" stroke-width="2"/>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">geography</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[dʒiˈɒɡrəfi] • γεωγραφία</text>
</svg>