<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_on_time" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fff4"/>
      <stop offset="100%" stop-color="#c6f6d5"/>
    </linearGradient>
    <pattern id="dots_on_time" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#38a169" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_on_time" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_on_time)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_on_time)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="208" height="22" rx="6" fill="#38a169" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_on_time)"/>
    <text x="104" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">WORLD CUSTOMS & MANNERS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-8)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#48bb78" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">EXACT!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_on_time)">
    
      <!-- Wall Clock showing 8:30 AM with checkmark -->
      <circle cx="-14" cy="0" r="30" fill="#ffffff" stroke="#1a202c" stroke-width="3.5"/>
      <line x1="-14" y1="0" x2="-14" y2="-16" stroke="#1a202c" stroke-width="4" stroke-linecap="round"/>
      <line x1="-14" y1="0" x2="-14" y2="18" stroke="#e53e3e" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-14" cy="0" r="4" fill="#1a202c"/>
      <!-- Green Checkmark Badge -->
      <g transform="translate(26, 4)">
        <circle cx="0" cy="0" r="16" fill="#48bb78" stroke="#1a202c" stroke-width="2.5"/>
        <path d="M -7,-1 L -2,4 L 8,-6" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">on time</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ɒn ˈtaɪm] • στην ώρα μου, στην ώρα του</text>
</svg>