<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_timetable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#e9d8fd"/>
    </linearGradient>
    <pattern id="dots_timetable" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#805ad5" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_timetable" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_timetable)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_timetable)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="184" height="22" rx="6" fill="#805ad5" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_timetable)"/>
    <text x="92" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SCHOOL LIFE & PLACES</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-8)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#b794f4" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">WEEKLY!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_timetable)">
    
      <!-- Timetable Grid Paper -->
      <rect x="-48" y="-36" width="96" height="72" rx="6" fill="#ffffff" stroke="#1a202c" stroke-width="3.5"/>
      <line x1="-48" y1="-20" x2="48" y2="-20" stroke="#1a202c" stroke-width="2"/>
      <line x1="-48" y1="-4" x2="48" y2="-4" stroke="#cbd5e0" stroke-width="1.5"/>
      <line x1="-48" y1="12" x2="48" y2="12" stroke="#cbd5e0" stroke-width="1.5"/>
      <line x1="-20" y1="-36" x2="-20" y2="36" stroke="#cbd5e0" stroke-width="1.5"/>
      <line x1="8" y1="-36" x2="8" y2="36" stroke="#cbd5e0" stroke-width="1.5"/>
      <!-- Color blocks representing classes -->
      <rect x="-16" y="-16" width="20" height="8" rx="2" fill="#4299e1"/>
      <rect x="12" y="-16" width="28" height="8" rx="2" fill="#48bb78"/>
      <rect x="-16" y="0" width="20" height="8" rx="2" fill="#ed8936"/>
      <rect x="12" y="16" width="28" height="8" rx="2" fill="#9f7aea"/>
      <!-- Header text -->
      <text x="0" y="-26" font-family="'Outfit', sans-serif" font-size="7" font-weight="900" fill="#1a202c" text-anchor="middle">MON • TUE • WED</text>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">timetable</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ˈtaɪmteɪbl] • ωρολόγιο πρόγραμμα</text>
</svg>