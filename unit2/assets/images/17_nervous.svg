<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_nervous" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffff0"/>
      <stop offset="100%" stop-color="#fefcbf"/>
    </linearGradient>
    <pattern id="dots_nervous" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#d69e2e" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_nervous" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_nervous)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_nervous)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="176" height="22" rx="6" fill="#d69e2e" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_nervous)"/>
    <text x="88" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FEELINGS & EMOTIONS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-10)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#faf089" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">GULP!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_nervous)">
    
      <!-- Nervous Sweating Face -->
      <circle cx="0" cy="0" r="38" fill="#faf089" stroke="#1a202c" stroke-width="3.5"/>
      <!-- High worried brows -->
      <path d="M -22,-14 Q -14,-20 -6,-12" stroke="#1a202c" stroke-width="3.5" fill="none"/>
      <path d="M 22,-14 Q 14,-20 6,-12" stroke="#1a202c" stroke-width="3.5" fill="none"/>
      <!-- Big wide eyes -->
      <circle cx="-14" cy="-2" r="5" fill="#1a202c"/>
      <circle cx="14" cy="-2" r="5" fill="#1a202c"/>
      <!-- Wobbly squiggly mouth -->
      <path d="M -16,18 Q -8,12 0,18 Q 8,24 16,18" stroke="#1a202c" stroke-width="3.5" fill="none"/>
      <!-- Big sweat drop -->
      <path d="M 28,-18 Q 36,-10 32,-4 Q 26,0 24,-6 Z" fill="#63b3ed" stroke="#1a202c" stroke-width="2"/>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">nervous</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ˈnɜːvəs] • νευρικός, αγχωμένος</text>
</svg>