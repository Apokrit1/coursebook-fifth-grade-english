<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_apple_juice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fff4"/>
      <stop offset="100%" stop-color="#c6f6d5"/>
    </linearGradient>
    <pattern id="dots_apple_juice" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#38a169" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_apple_juice" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_apple_juice)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_apple_juice)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="192" height="22" rx="6" fill="#38a169" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_apple_juice)"/>
    <text x="96" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FOOD & CANTEEN SNACKS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(10)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#68d391" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">SWEET!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_apple_juice)">
    
      <!-- Glass -->
      <polygon points="-22,-36 22,-36 17,34 -17,34" fill="#e2e8f0" stroke="#1a202c" stroke-width="3.5" opacity="0.5"/>
      <!-- Apple Juice -->
      <polygon points="-20,-10 20,-10 15,32 -15,32" fill="#ecc94b" stroke="#1a202c" stroke-width="2.5"/>
      <!-- Red Apple beside glass -->
      <g transform="translate(-28, 12)">
        <ellipse cx="0" cy="0" rx="18" ry="17" fill="#e53e3e" stroke="#1a202c" stroke-width="3"/>
        <path d="M 0,-17 Q 4,-24 8,-22" stroke="#744210" stroke-width="3" fill="none"/>
        <ellipse cx="6" cy="-22" rx="6" ry="3" fill="#48bb78" transform="rotate(-30 6 -22)" stroke="#1a202c" stroke-width="1.5"/>
      </g>
      <!-- Straw -->
      <line x1="8" y1="-46" x2="-2" y2="28" stroke="#319795" stroke-width="4.5" stroke-linecap="round"/>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">apple juice</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ˌæpl ˈdʒuːs] • χυμός μήλου</text>
</svg>