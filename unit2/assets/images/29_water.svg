<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebf8ff"/>
      <stop offset="100%" stop-color="#bee3f8"/>
    </linearGradient>
    <pattern id="dots_water" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#3182ce" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_water" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_water)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_water)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="192" height="22" rx="6" fill="#3182ce" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_water)"/>
    <text x="96" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FOOD & CANTEEN SNACKS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-10)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#63b3ed" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">PURE!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_water)">
    
      <!-- Clear Glass with water -->
      <polygon points="-24,-36 24,-36 18,36 -18,36" fill="#bee3f8" stroke="#1a202c" stroke-width="3.5"/>
      <polygon points="-22,-14 22,-14 16,34 -16,34" fill="#63b3ed" stroke="#1a202c" stroke-width="2.5" opacity="0.8"/>
      <!-- Ice Cubes -->
      <rect x="-12" y="-4" width="14" height="14" rx="2" fill="#ffffff" stroke="#1a202c" stroke-width="2" transform="rotate(15 -12 -4)"/>
      <rect x="2" y="8" width="12" height="12" rx="2" fill="#ffffff" stroke="#1a202c" stroke-width="2" transform="rotate(-20 2 8)"/>
      <!-- Bubbles -->
      <circle cx="-6" cy="24" r="3" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
      <circle cx="8" cy="28" r="2.5" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
      <circle cx="2" cy="18" r="2" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">water</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ˈwɔːtə] • νερό</text>
</svg>