<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_maths" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebf8ff"/>
      <stop offset="100%" stop-color="#bee3f8"/>
    </linearGradient>
    <pattern id="dots_maths" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#3182ce" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_maths" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_maths)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_maths)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="144" height="22" rx="6" fill="#3182ce" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_maths)"/>
    <text x="72" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SCHOOL SUBJECTS</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-10)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#ecc94b" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">π = 3.14</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_maths)">
    
      <!-- Calculator & Geometry Set Square -->
      <!-- Triangle ruler -->
      <polygon points="-44,28 10,28 -44,-26" fill="#ecc94b" stroke="#1a202c" stroke-width="3.5"/>
      <polygon points="-36,20 -4,20 -36,-12" fill="#ebf8ff" stroke="#1a202c" stroke-width="2"/>
      <!-- Calculator -->
      <g transform="translate(18, -4)">
        <rect x="-22" y="-28" width="44" height="60" rx="6" fill="#2d3748" stroke="#1a202c" stroke-width="3.5"/>
        <rect x="-16" y="-22" width="32" height="14" rx="2" fill="#9ae6b4" stroke="#1a202c" stroke-width="1.5"/>
        <text x="12" y="-12" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="end">42</text>
        <!-- Buttons -->
        <circle cx="-10" cy="2" r="3.5" fill="#e2e8f0"/>
        <circle cx="0" cy="2" r="3.5" fill="#e2e8f0"/>
        <circle cx="10" cy="2" r="3.5" fill="#ed8936"/>
        <circle cx="-10" cy="14" r="3.5" fill="#e2e8f0"/>
        <circle cx="0" cy="14" r="3.5" fill="#e2e8f0"/>
        <circle cx="10" cy="14" r="3.5" fill="#48bb78"/>
      </g>
    
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">maths</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[mæθs] • μαθηματικά</text>
</svg>