<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="grad_66_safe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
    <pattern id="pat_grad_66_safe" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#EC4899" opacity="0.12"/>
    </pattern>
    <filter id="shadow_grad_66_safe" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0F172A" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Outer Comic Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#grad_66_safe)" stroke="#0F172A" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#pat_grad_66_safe)"/>

  <!-- Category Badge -->
  <g transform="translate(14, 14)">
    <rect width="255" height="22" rx="6" fill="#EC4899" stroke="#0F172A" stroke-width="2" filter="url(#shadow_grad_66_safe)"/>
    <text x="127.5" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ENVIRONMENT, OPINIONS &amp; CITY LIFE</text>
  </g>

  <!-- Comic Burst -->
  <g transform="translate(250, 22) rotate(10)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#F472B6" stroke="#0F172A" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#0F172A" text-anchor="middle">GREEN!</text>
  </g>

  <!-- Center Graphic Icon & Visual Element -->
  <g transform="translate(160, 102)" filter="url(#shadow_grad_66_safe)">
    <circle cx="0" cy="0" r="42" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <text x="0" y="14" font-size="40" text-anchor="middle">🛡️</text>
  </g>

  <!-- Word, IPA & Greek Gloss -->
  <text x="160" y="176" font-family="'Outfit', sans-serif" font-size="19" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">safe</text>
  <text x="160" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4B5563" text-anchor="middle">[seɪf] • ασφαλής</text>
</svg>