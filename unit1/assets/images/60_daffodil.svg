<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_daffodil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffff0"/>
      <stop offset="100%" stop-color="#fefcbf"/>
    </linearGradient>
    <pattern id="dots_daffodil" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#d69e2e" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_daffodil" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_daffodil)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_daffodil)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="152" height="22" rx="6" fill="#d69e2e" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_daffodil)"/>
    <text x="76" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SYMBOLS & NATURE</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-10)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#faf089" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">WALES</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_daffodil)">
    <polygon points="0,-32 18,-6 8,14 -8,14 -18,-6" fill="#ecc94b" stroke="#1a202c" stroke-width="3"/><ellipse cx="0" cy="-12" rx="12" ry="12" fill="#faf089"/><line x1="0" y1="14" x2="0" y2="34" stroke="#38a169" stroke-width="4.5"/>
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">daffodil</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ˈdæfədɪl] • νάρκισσος</text>
</svg>