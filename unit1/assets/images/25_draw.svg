<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_draw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#fed7e2"/>
    </linearGradient>
    <pattern id="dots_draw" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#ed64a6" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_draw" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_draw)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_draw)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="176" height="22" rx="6" fill="#ed64a6" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_draw)"/>
    <text x="88" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FREE TIME & HOBBIES</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(-8)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#fbb6ce" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">SKETCH!</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_draw)">
    <rect x="-24" y="-28" width="48" height="60" rx="4" fill="#ffffff" stroke="#1a202c" stroke-width="3"/><g transform="translate(14, -6) rotate(45)"><rect x="-4" y="-24" width="8" height="38" fill="#ecc94b" stroke="#1a202c" stroke-width="2"/><polygon points="-4,14 4,14 0,24" fill="#1a202c"/></g>
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">draw</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[drɔː] • σχεδιάζω / ζωγραφίζω</text>
</svg>