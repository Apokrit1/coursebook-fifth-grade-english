<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGrad_Great_Britain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebf8ff"/>
      <stop offset="100%" stop-color="#bee3f8"/>
    </linearGradient>
    <pattern id="dots_Great_Britain" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#2b6cb0" opacity="0.12"/>
    </pattern>
    <filter id="comicShadow_Great_Britain" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1a202c" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Panel Outer Frame -->
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#bgGrad_Great_Britain)" stroke="#1a202c" stroke-width="3.5"/>
  <rect x="4" y="4" width="312" height="212" rx="12" fill="url(#dots_Great_Britain)"/>

  <!-- Category Tag -->
  <g transform="translate(14, 14)">
    <rect width="192" height="22" rx="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="2" filter="url(#comicShadow_Great_Britain)"/>
    <text x="96" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">COUNTRIES & GEOGRAPHY</text>
  </g>

  <!-- Comic Sound Burst -->
  
  <g transform="translate(244, 22) rotate(12)">
    <polygon points="0,10 12,0 24,8 36,0 34,14 46,18 36,26 44,38 30,34 22,44 18,32 6,36 10,24 0,18" fill="#ecc94b" stroke="#1a202c" stroke-width="2"/>
    <text x="22" y="26" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#1a202c" text-anchor="middle">UK</text>
  </g>

  <!-- Graphic Novel Artwork -->
  <g transform="translate(160, 102)" filter="url(#comicShadow_Great_Britain)">
    <rect x="-36" y="-24" width="72" height="48" fill="#2b6cb0" stroke="#1a202c" stroke-width="3.5"/><line x1="-36" y1="-24" x2="36" y2="24" stroke="#ffffff" stroke-width="7"/><line x1="-36" y1="24" x2="36" y2="-24" stroke="#ffffff" stroke-width="7"/><line x1="-36" y1="-24" x2="36" y2="24" stroke="#e53e3e" stroke-width="3"/><line x1="-36" y1="24" x2="36" y2="-24" stroke="#e53e3e" stroke-width="3"/><line x1="0" y1="-24" x2="0" y2="24" stroke="#ffffff" stroke-width="12"/><line x1="-36" y1="0" x2="36" y2="0" stroke="#ffffff" stroke-width="12"/><line x1="0" y1="-24" x2="0" y2="24" stroke="#e53e3e" stroke-width="6"/><line x1="-36" y1="0" x2="36" y2="0" stroke="#e53e3e" stroke-width="6"/>
  </g>

  <!-- Comic Word & Greek Info -->
  <text x="160" y="180" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">Great Britain</text>
  <text x="160" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">[ɡreɪt ˈbrɪtn] • Μεγάλη Βρετανία</text>
</svg>